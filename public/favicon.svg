<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Deep navy rounded square background -->
  <rect width="32" height="32" rx="7" fill="#1a2138"/>
  <!-- Calendar grid lines -->
  <path d="M8 12h16M8 18h16M14 8v18M20 8v18" stroke="#3b5998" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
  <!-- Accent spark/checkmark representing progress -->
  <path d="M10 16.5l4 4 8-9" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top binding dots -->
  <circle cx="12" cy="7" r="1.5" fill="#6488e8"/>
  <circle cx="20" cy="7" r="1.5" fill="#6488e8"/>
  <defs>
    <linearGradient id="grad" x1="10" y1="11" x2="22" y2="21" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c9ef7"/>
      <stop offset="1" stop-color="#4a6dd9"/>
    </linearGradient>
  </defs>
</svg>
