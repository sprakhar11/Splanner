<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1a2138" />
    <title>Splanner</title>
    <script>
      // Restore the privacy blur before first paint, so reloading while blurred
      // never flashes readable content onto a screen other people can see.
      try {
        if (localStorage.getItem('splanner.privacyBlur') === 'true') {
          document.documentElement.classList.add('privacy-blur')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
